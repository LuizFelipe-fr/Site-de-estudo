<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Estudo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tema.js"></script>
</head>
<body>

    <div class="scroll-progresso"></div>

    <header class="hero hero--pagina">
        <canvas class="hero__particulas" aria-hidden="true"></canvas>
        <a href="index.html" class="btn--voltar">← Voltar</a>
        <h1>📘 Modo Estudo</h1>
        <p>Aprenda sem pressão. Errou? Aqui você entende o porquê.</p>
        <svg class="hero__onda" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
            <path fill="currentColor" d="M0,40 C240,70 480,10 720,25 C960,40 1200,70 1440,35 L1440,60 L0,60 Z"></path>
        </svg>
    </header>

    <main>

        <section class="selecao" id="selecao">
            <div class="secao-titulo" data-reveal>
                <h2>Escolha uma <span class="texto-gradiente">matéria</span> para treinar</h2>
                <p>Correção na hora, com explicação em cada questão.</p>
            </div>

            <div class="selecao__opcoes">
                <button class="opcao-grande" data-materia="matematica" type="button" data-reveal="0">
                    <span>📐</span> Matemática
                </button>
                <button class="opcao-grande" data-materia="portugues" type="button" data-reveal="70">
                    <span>📖</span> Português
                </button>
                <button class="opcao-grande" data-materia="ciencias" type="button" data-reveal="140">
                    <span>🔬</span> Ciências
                </button>
                <button class="opcao-grande" data-materia="geral" type="button" data-reveal="210">
                    <span>🌍</span> Conhecimentos Gerais
                </button>
            </div>
        </section>

        <section class="quiz oculto" id="quiz">
            <div class="quiz__topo">
                <span class="quiz__contador" id="contador"></span>
            </div>

            <div class="barra-progresso">
                <div class="barra-progresso__preenchida" id="barra"></div>
            </div>

            <h2 class="quiz__pergunta" id="pergunta"></h2>
            <div class="opcoes" id="opcoes"></div>
            <div class="feedback" id="feedback"></div>

            <div class="quiz__rodape">
                <button class="btn btn--primario" id="proximo" type="button" disabled>Próxima</button>
            </div>
        </section>

        <section class="quiz resultado oculto" id="resultado"></section>

    </main>

    <footer>
        <p>Projeto acadêmico desenvolvido em HTML, CSS e JavaScript — UNINTER</p>
    </footer>

    <script src="js/animacoes.js"></script>
    <script src="js/banco-questoes.js"></script>
    <script src="js/progresso.js"></script>
    <script src="js/quiz.js"></script>
    <script>
        const selecao = document.getElementById("selecao");
        let materiaAtual = null;

        const quiz = criarQuiz({
            feedbackImediato: true,
            salvar: false,
            permitirRefazer: true,
            aoRefazer: () => embaralhar(questoesPorMateria(materiaAtual)),
            aoSelecionar: () => selecao.classList.remove("oculto")
        });

        document.querySelectorAll("[data-materia]").forEach(botao => {
            botao.addEventListener("click", () => {
                materiaAtual = botao.dataset.materia;
                selecao.classList.add("oculto");
                quiz.iniciar(embaralhar(questoesPorMateria(materiaAtual)));
            });
        });
    </script>
</body>
</html>

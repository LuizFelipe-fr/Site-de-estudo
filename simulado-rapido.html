<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado Rápido</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/tema.js"></script>
</head>
<body>

    <div class="scroll-progresso"></div>

    <header class="hero hero--pagina">
        <canvas class="hero__particulas" aria-hidden="true"></canvas>
        <a href="index.html" class="btn--voltar">← Voltar</a>
        <h1>🎯 Simulado Rápido</h1>
        <p>Dez questões variadas em cinco minutos para treinar todo dia.</p>
        <svg class="hero__onda" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true">
            <path fill="currentColor" d="M0,40 C240,70 480,10 720,25 C960,40 1200,70 1440,35 L1440,60 L0,60 Z"></path>
        </svg>
    </header>

    <main>

        <section class="quiz" id="quiz">
            <div class="quiz__topo">
                <span class="quiz__contador" id="contador"></span>
                <span class="tempo" id="tempo">⏱️ 05:00</span>
            </div>

            <div class="barra-progresso">
                <div class="barra-progresso__preenchida" id="barra"></div>
            </div>

            <h2 class="quiz__pergunta" id="pergunta"></h2>
            <div class="opcoes" id="opcoes"></div>
            <div class="feedback" id="feedback"></div>

            <div class="quiz__rodape">
                <button class="btn btn--primario" id="proximo" type="button" disabled>Próxima</button>
            </div>
        </section>

        <section class="quiz resultado oculto" id="resultado"></section>

    </main>

    <footer>
        <p>Projeto acadêmico desenvolvido em HTML, CSS e JavaScript — UNINTER</p>
    </footer>

    <script src="js/animacoes.js"></script>
    <script src="js/banco-questoes.js"></script>
    <script src="js/progresso.js"></script>
    <script src="js/quiz.js"></script>
    <script>
        const quiz = criarQuiz({
            tempoSegundos: 300,
            feedbackImediato: false,
            permitirRefazer: true,
            aoRefazer: () => sortearQuestoes(10)
        });

        quiz.iniciar(sortearQuestoes(10));
    </script>
</body>
</html>
